# ==================== 服务器 ====================
server.port=${SERVER_PORT:8088}
# context-path 去掉，让 Spring Boot 在根路径提供 static 前端文件
# API 路径由 Controller @RequestMapping("/api/xxx") 前缀

# ==================== 数据源 ====================
# 全部支持环境变量覆盖，默认值面向本地开箱即用：DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/shared_kitchen?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Hibernate 6.4 自动检测 MySQL 方言，不需要显式配置

# ==================== 日志 ====================
logging.level.root=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# ==================== 初始数据 ====================
# data.sql 必须等 Hibernate 建表之后再执行，否则空库首次启动会因为表不存在而全部失败，
# 又被 continue-on-error 静默吞掉 —— 表现是“启动成功但登录永远失败”。
spring.jpa.defer-datasource-initialization=true
# 每次启动都执行 data.sql；想只在首次建库时灌一次就设 SQL_INIT_MODE=never
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# ==================== 静态资源 ====================
spring.web.resources.static-locations=classpath:/static/

# ==================== JWT ====================
# 生产部署务必用环境变量覆盖：JWT_SECRET=<至少32字节的随机串>
jwt.secret=${JWT_SECRET:shared-kitchen-dev-only-jwt-secret-key-change-me-32b}
jwt.expiration=86400000
jwt.header=Authorization
jwt.prefix=Bearer

# ==================== 跨域 ====================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:8088,http://127.0.0.1:8088,http://localhost:8080,http://localhost:8087,http://localhost:3000}

# SQL 初始化编码
spring.sql.init.encoding=UTF-8
