services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: shared_kitchen
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./backend
    ports:
      - "8088:8088"
    environment:
      # 容器内用 db 这个服务名，其余参数保持与本地开发一致
      DB_URL: jdbc:mysql://db:3306/shared_kitchen?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: 123456
      # 生产请替换成随机串（至少 32 字节）
      JWT_SECRET: please-change-this-dev-secret-at-least-32-bytes
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
